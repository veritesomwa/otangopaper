<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OtangoPaper">
  <title>OtangoPaper</title>
  <defs>
    <!-- Cobalt → cyan diagonal -->
    <linearGradient id="op-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0C2A5C"/>
      <stop offset="55%"  stop-color="#1756C8"/>
      <stop offset="100%" stop-color="#00C8D4"/>
    </linearGradient>
    <!-- Soft top-light sheen -->
    <linearGradient id="op-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Paper sheet inner colour -->
    <linearGradient id="op-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8F0FF"/>
    </linearGradient>
    <!-- Subtle drop shadow under the paper sheet -->
    <filter id="op-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Squircle background with sheen + thin highlight rim -->
  <rect x="10" y="10" width="180" height="180" rx="46" ry="46" fill="url(#op-bg)"/>
  <rect x="10" y="10" width="180" height="180" rx="46" ry="46" fill="url(#op-sheen)"/>
  <rect x="10.5" y="10.5" width="179" height="179" rx="45.5" ry="45.5"
        fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>

  <!-- Paper sheet with folded top-right corner -->
  <g filter="url(#op-shadow)">
    <path d="M 56 46
             L 124 46
             L 154 76
             L 154 154
             Q 154 162 146 162
             L 64 162
             Q 56 162 56 154
             Z"
          fill="url(#op-paper)"/>
    <!-- Folded triangle, two tones to give depth -->
    <path d="M 124 46 L 154 76 L 124 76 Z" fill="#B3D4FF"/>
    <path d="M 124 46 L 124 76 L 154 76 Z" fill="#FFFFFF" opacity="0.55"/>
  </g>

  <!-- Text-line strokes inside the page (suggesting a document) -->
  <g fill="#1756C8">
    <rect x="72"  y="92"  width="50" height="5" rx="2.5" opacity="0.85"/>
    <rect x="72"  y="106" width="62" height="4" rx="2"   opacity="0.50"/>
    <rect x="72"  y="118" width="38" height="4" rx="2"   opacity="0.50"/>
    <rect x="72"  y="130" width="56" height="4" rx="2"   opacity="0.50"/>
    <rect x="72"  y="142" width="44" height="4" rx="2"   opacity="0.50"/>
  </g>
</svg>
